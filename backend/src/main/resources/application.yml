
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: gametest-hub-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gametesthub}
    username: ${DB_USERNAME:gametesthub}
    password: ${DB_PASSWORD:local_dev_only_change_me}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  info:
    env:
      enabled: false

info:
  app:
    name: GameTest Hub
    description: Gaming QA Management Platform
    version: 0.1.0

logging:
  level:
    root: INFO
    com.gametesthub: INFO
